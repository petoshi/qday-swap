<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#030403">
  <meta name="description" content="QDAY Swap local wallet and atomic swap application.">
  <title>QDAY Swap</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-line">
      <a class="brand" href="#market" aria-label="QDAY Swap"><strong>QDAY</strong><span>/</span><b>SWAP</b></a>
      <div class="header-stats">
        <span>QDAY <b id="header-qday">—</b></span>
        <span>BITCOIN <b id="header-bitcoin">—</b></span>
        <span>ACTIVE <b id="header-swaps">0</b></span>
        <span>BTC/USD <b id="header-btc-usd">—</b></span>
        <span>QDAY/USD <b id="header-qday-usd">N/A</b></span>
      </div>
      <div class="runtime-actions">
        <div class="node-pill waiting" id="node-pill" hidden><i></i><span>STARTING</span></div>
        <div class="notification-center" id="notification-center" hidden>
          <button class="notification-button" id="notification-button" type="button" aria-label="Swap notifications" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
            <span id="notification-count" hidden>0</span>
          </button>
          <section class="notification-panel hidden" id="notification-panel" aria-label="Unread swap notifications"></section>
        </div>
        <button class="exit-button" id="exit-app" type="button" title="Stop QDAY Swap and both local wallet services" aria-label="Exit QDAY Swap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10m6.36-6.36a9 9 0 1 1-12.72 0"/></svg>
          <span>EXIT QDAY SWAP</span>
        </button>
      </div>
    </div>
    <div class="header-line header-tools">
      <nav id="main-nav" aria-label="Main navigation">
        <a href="#market" data-route="market">ORDERS</a>
        <a href="#swaps" data-route="swaps">SWAPS</a>
        <a href="#history" data-route="history">HISTORY</a>
        <a href="#wallets" data-route="wallets">WALLETS</a>
      </nav>
    </div>
  </header>

  <main id="app" aria-live="polite">
    <section class="loading"><p><b>$</b> opening local wallet<span class="terminal-cursor">_</span></p></section>
  </main>

  <footer>
    <div class="footer-brand"><strong>QDAY / SWAP</strong><span>LOCAL HYBRID POST QUANTUM ATOMIC SWAPS</span></div>
    <div class="footer-links">
      <a href="https://explorer.pqday.com" target="_blank" rel="noreferrer">Explorer</a>
      <a href="https://pqday.com" target="_blank" rel="noreferrer">Website</a>
      <a href="https://github.com/petoshi" target="_blank" rel="noreferrer">Source</a>
    </div>
  </footer>

  <div class="modal-backdrop hidden" id="modal-backdrop" role="presentation">
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></section>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="/app.js" defer></script>
</body>
</html>
