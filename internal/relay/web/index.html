<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111216">
  <meta name="description" content="QDAY and Bitcoin atomic swap order explorer.">
  <title>QDAY Order Explorer</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css?v=10">
</head>
<body>
  <header class="site-header">
    <div class="header-line">
      <a class="brand route-link" href="/" aria-label="QDAY Order Explorer home"><strong>QDAY</strong><span>/</span><b>ORDER EXPLORER</b></a>
      <div class="header-stats" aria-label="Relay statistics">
        <span>OPEN <b id="header-open">—</b></span>
        <span>24H <b id="header-day">—</b></span>
        <span>TOTAL <b id="header-total">—</b></span>
        <span>BTC/USD <b id="header-btc-usd">—</b></span>
        <span>QDAY/USD <b id="header-qday-usd">N/A</b></span>
      </div>
      <div class="live-pill connecting"><i></i><span id="relay-pill">CONNECTING</span></div>
    </div>
    <div class="header-line header-tools">
      <nav class="main-nav" aria-label="Main navigation">
        <a class="route-link" data-nav="protocol" href="/">PROTOCOL</a>
        <a class="route-link" data-nav="market" href="/orders">ORDERS</a>
        <a class="route-link" data-nav="activity" href="/activity">ACTIVITY</a>
      </nav>
      <nav class="downloads" aria-label="Download QDAY Swap">
        <span class="build-pending">PUBLIC BUILD IN TESTING</span>
      </nav>
    </div>
  </header>

  <main id="app" aria-live="polite">
    <section class="loading-page"><p><b>$</b> connecting to relay<span class="terminal-cursor">_</span></p></section>
  </main>

  <footer>
    <div class="footer-brand"><strong>QDAY / ORDER EXPLORER</strong><span>QDAY ↔ BTC ATOMIC SWAPS</span></div>
    <div class="footer-links">
      <a href="https://pqday.com" target="_blank" rel="noreferrer">Website</a>
      <a href="https://explorer.pqday.com" target="_blank" rel="noreferrer">Explorer</a>
      <a href="https://github.com/petoshi/qday" target="_blank" rel="noreferrer">QDAY source</a>
      <a href="https://x.com/_petoshi" target="_blank" rel="noreferrer">petoshi</a>
    </div>
  </footer>

  <div id="toast" class="toast" role="status"></div>
  <script src="/app.js?v=10" defer></script>
</body>
</html>
